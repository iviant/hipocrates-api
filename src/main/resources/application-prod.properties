
# CONFIGURACIÓN DE PRODUCCIÓN

# La base de datos se configura mediante variables de entorno.
# No guardamos contraseñas reales en el proyecto.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / HIBERNATE

# Comprueba las tablas existentes sin modificarlas.
spring.jpa.hibernate.ddl-auto=validate

# No muestra consultas SQL en producción.
spring.jpa.show-sql=false

# Evita mantener abierta la sesión JPA durante la respuesta.
spring.jpa.open-in-view=false

# SEGURIDAD

# Desactiva la consola de H2.
spring.h2.console.enabled=false

# Evita mostrar detalles internos de los errores.
server.error.include-message=never
server.error.include-stacktrace=never
