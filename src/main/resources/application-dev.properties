# BASE DE DATOS H2 PARA DESARROLLO

# Dirección de nuestra base de datos en memoria
spring.datasource.url=jdbc:h2:mem:hipocrates_dev

# Driver que permite conectar con H2
spring.datasource.driver-class-name=org.h2.Driver

# Usuario de la base de datos
spring.datasource.username=sa

# Contraseña vacía para desarrollo
spring.datasource.password=

# JPA / HIBERNATE

# Actualiza las tablas según nuestras entidades Java
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola
spring.jpa.show-sql=true

# Consola H2

# Activa la consola web de H2
spring.h2.console.enabled=true

# Ruta para acceder a la consola H2
spring.h2.console.path=/h2-console

# Evita consultas adicionales durante la generación de respuestas
spring.jpa.open-in-view=false
