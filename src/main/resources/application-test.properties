
# BASE DE DATOS PARA LOS TESTS

# Base de datos H2 independiente para pruebas
spring.datasource.url=jdbc:h2:mem:hipocrates_test;DB_CLOSE_DELAY=-1

# Driver de H2
spring.datasource.driver-class-name=org.h2.Driver

# Credenciales para las pruebas
spring.datasource.username=sa
spring.datasource.password=

# JPA / HIBERNATE

# Crea las tablas al iniciar y las elimina al cerrar
spring.jpa.hibernate.ddl-auto=create-drop

# Evita mostrar todas las consultas SQL durante los tests
spring.jpa.show-sql=false

# Desactiva la consola H2 durante las pruebas
spring.h2.console.enabled=false

# Evita mantener abierta la sesión JPA durante las respuestas
spring.jpa.open-in-view=false
